# Run by hand from the Actions tab: builds the macOS, Windows and Linux installers and publishes them as a GitHub Release tagged v<version>.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号，须与 package.json 的 version 一致（如 1.0.0-beta.2）"
        required: true
        type: string

env:
  VERSION: ${{ inputs.version }}

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # checkout otherwise leaves the token in .git/config, readable by the install scripts npm ci runs
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check the version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$package_version" ]; then
            echo "::error::填的版本 $VERSION 和 package.json 的 $package_version 不一致：先改 package.json 的 version 并推送，再发版"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::v$VERSION 已经发布过了：先升 package.json 的 version"
            exit 1
          fi
      - run: npm ci
      - if: runner.os == 'Linux'
        run: npm run check
      # the certificate and Apple ID go only to the macOS job: on Windows electron-builder would also try to sign with CSC_LINK
      - if: runner.os == 'macOS'
        run: npm run dist:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - if: runner.os == 'Windows'
        run: npm run dist:win
      - if: runner.os == 'Linux'
        run: npm run dist:linux
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=$([[ "$VERSION" == *-* ]] && echo --prerelease || true)
          gh release create "v$VERSION" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes $prerelease
